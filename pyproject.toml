[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frider"
version = "0.2.0"
description = "Android app framework detector — classifies Flutter / Dart, React Native (Hermes vs JavaScriptCore), Apache Cordova, Capacitor, Ionic, Kony, Xamarin, Unity, or native Java/Kotlin from APK entry names. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["android", "apk", "framework", "detector", "flutter", "react-native", "apkid"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Reverse Engineering",
    "Topic :: Utilities",
]

[project.scripts]
frider = "frider.cli:main"

[tool.setuptools]
packages = ["frider"]

[tool.setuptools.package-data]
frider = ["rules.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
