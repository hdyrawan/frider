name: publish

# Uploads to PyPI with Trusted Publishing (OIDC) — no API token is stored in
# this repository. Before the first upload, a pending publisher must exist at
# https://pypi.org/manage/account/publishing/ naming this repo, this workflow
# file, and the environment used below.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine pytest

      - name: Run the suite
        run: python -m pytest tests -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata and README rendering
        run: python -m twine check dist/*

      - name: Install the built wheel and run it
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/frider --version

      - name: Refuse to publish if the tag disagrees with the version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import frider; print(frider.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match frider $version"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches frider $version"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: Upload to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload to PyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
